name: WorkflowTrial

on: push

jobs:
  hellow-world:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello"

      - name: copy repo
        uses: actions/checkout@v6 #this is from github to copy repo

      - name: list file
        run: ls -la #checking to see if the files were copied

      - name: generate ascii art #this is where you can install anything on these github hosted machines
        run:
          sudo apt-get install -y figlet
          figlet "TRIAL"
          echo "--------------------------"
          figlet -f digital "GitHub Action"
